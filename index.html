<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
    <title>Zenith · everything you need</title>
    <!-- Font & icons (minimal, no emoji) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ----- DESIGN SYSTEM (dark premium) ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0b0d10;
            --surface: #14171c;
            --surface-2: #1e222a;
            --border: #2b313a;
            --text: #e8edf5;
            --muted: #8a94a6;
            --primary: #6c8cff;
            --primary-hover: #5274e0;
            --success: #3dd68c;
            --warning: #f0b34b;
            --danger: #f25a6a;
            --radius: 14px;
            --shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
            --transition: 0.2s ease;
            --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            line-height: 1.5;
            display: flex;
            min-height: 100vh;
            transition: background 0.2s;
        }

        /* scroll */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--surface); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

        a { color: var(--primary); text-decoration: none; }
        .text-muted { color: var(--muted); }

        /* ----- SIDEBAR (desktop) ----- */
        .sidebar {
            width: 260px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            height: 100vh;
            position: sticky;
            top: 0;
            display: flex;
            flex-direction: column;
            padding: 1.5rem 0.8rem;
            transition: 0.2s;
            overflow-y: auto;
            flex-shrink: 0;
            z-index: 100;
        }
        .sidebar.collapsed { width: 72px; }
        .sidebar.collapsed .sidebar-label,
        .sidebar.collapsed .brand-text { display: none; }
        .sidebar.collapsed .brand-icon { font-size: 1.6rem; }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 0.8rem 1.8rem 0.8rem;
            border-bottom: 1px solid var(--border);
        }
        .brand-icon { font-size: 1.8rem; color: var(--primary); }
        .brand-text { font-weight: 600; font-size: 1.3rem; letter-spacing: -0.5px; }

        .sidebar-nav {
            flex: 1;
            margin-top: 1.5rem;
        }
        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 0.7rem 0.9rem;
            border-radius: var(--radius);
            color: var(--muted);
            transition: 0.15s;
            margin-bottom: 2px;
            font-weight: 450;
        }
        .sidebar-nav a i { width: 22px; font-size: 1.1rem; }
        .sidebar-nav a:hover, .sidebar-nav a.active {
            background: var(--surface-2);
            color: var(--text);
        }
        .sidebar-nav a.active { color: var(--primary); }

        .sidebar-footer {
            border-top: 1px solid var(--border);
            padding-top: 1.2rem;
            font-size: 0.8rem;
            color: var(--muted);
        }

        /* ----- MAIN LAYOUT ----- */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            max-width: 100%;
        }

        /* top bar */
        .topbar {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0.8rem 2rem;
            display: flex;
            align-items: center;
            gap: 1.2rem;
            flex-wrap: wrap;
            position: sticky;
            top: 0;
            z-index: 50;
        }
        .topbar .menu-toggle { display: none; background: none; border: none; color: var(--text); font-size: 1.3rem; cursor: pointer; }
        .topbar .search-wrap {
            flex: 1;
            display: flex;
            align-items: center;
            background: var(--bg);
            border-radius: 40px;
            padding: 0.3rem 1rem;
            border: 1px solid var(--border);
            min-width: 160px;
        }
        .topbar .search-wrap i { color: var(--muted); margin-right: 10px; }
        .topbar .search-wrap input {
            background: transparent;
            border: none;
            color: var(--text);
            width: 100%;
            padding: 0.5rem 0;
            outline: none;
            font-size: 0.9rem;
        }
        .topbar .actions {
            display: flex;
            align-items: center;
            gap: 1.2rem;
        }
        .topbar .actions button {
            background: none;
            border: none;
            color: var(--muted);
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.15s;
        }
        .topbar .actions button:hover { color: var(--text); }

        .workspace-badge {
            background: var(--surface-2);
            padding: 0.2rem 0.9rem;
            border-radius: 30px;
            font-size: 0.8rem;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* page content */
        .page-content {
            padding: 2rem 2.2rem;
            flex: 1;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        /* cards */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin: 1.8rem 0;
        }
        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.2rem 1.5rem;
            transition: 0.15s;
        }
        .stat-card:hover { border-color: var(--primary); }
        .stat-card .num { font-size: 2rem; font-weight: 600; margin: 0.3rem 0; }
        .stat-card .label { color: var(--muted); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.4px; }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
            margin-bottom: 1.8rem;
        }
        .card-title { font-weight: 600; font-size: 1.1rem; margin-bottom: 1rem; display: flex; align-items: center; gap: 8px; }

        .btn {
            background: var(--surface-2);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }
        .btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
        .btn-danger { background: var(--danger); border-color: var(--danger); color: #fff; }
        .btn-danger:hover { background: #d94454; }
        .btn-sm { padding: 0.3rem 0.9rem; font-size: 0.8rem; }
        .btn-outline { background: transparent; }

        .flex { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }

        .badge {
            background: var(--surface-2);
            padding: 0.15rem 0.7rem;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 500;
            border: 1px solid var(--border);
        }
        .badge-owner { background: #6c8cff20; color: var(--primary); border-color: var(--primary); }

        /* forms */
        input, select, textarea {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0.7rem 1rem;
            color: var(--text);
            width: 100%;
            font-family: var(--font);
            transition: 0.15s;
        }
        input:focus, select:focus, textarea:focus { border-color: var(--primary); outline: none; }
        label { font-weight: 450; font-size: 0.9rem; margin-bottom: 0.3rem; display: block; }
        .form-group { margin-bottom: 1.2rem; }

        /* modals */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: 0.2s;
        }
        .modal-overlay.open { opacity: 1; pointer-events: auto; }
        .modal-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            max-width: 520px;
            width: 95%;
            padding: 2rem;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow);
        }

        /* toast */
        .toast-container {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .toast {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 0.8rem 1.5rem;
            box-shadow: var(--shadow);
            min-width: 200px;
            backdrop-filter: blur(4px);
            animation: slideIn 0.25s ease;
        }
        .toast-success { border-left: 4px solid var(--success); }
        .toast-error { border-left: 4px solid var(--danger); }
        @keyframes slideIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* mobile bottom nav */
        .bottom-nav {
            display: none;
            background: var(--surface);
            border-top: 1px solid var(--border);
            padding: 0.4rem 0;
            position: sticky;
            bottom: 0;
            justify-content: space-around;
            z-index: 60;
        }
        .bottom-nav a {
            color: var(--muted);
            font-size: 1.2rem;
            padding: 0.5rem 0.8rem;
            border-radius: 30px;
            transition: 0.15s;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.7rem;
            gap: 2px;
        }
        .bottom-nav a i { font-size: 1.3rem; }
        .bottom-nav a.active { color: var(--primary); }

        /* responsive */
        @media (max-width: 1024px) {
            .sidebar { width: 220px; }
            .sidebar.collapsed { width: 64px; }
        }
        @media (max-width: 820px) {
            .sidebar { position: fixed; left: -300px; width: 260px; height: 100%; transition: 0.25s; box-shadow: var(--shadow); }
            .sidebar.open { left: 0; }
            .topbar .menu-toggle { display: block; }
            .bottom-nav { display: flex; }
            .page-content { padding: 1.2rem; }
        }
        @media (max-width: 480px) {
            .topbar { padding: 0.6rem 1rem; }
            .topbar .search-wrap { min-width: 100px; }
            .card-grid { grid-template-columns: 1fr 1fr; }
            .stat-card .num { font-size: 1.5rem; }
        }

        /* utilities */
        .hidden { display: none !important; }
        .mt-2 { margin-top: 1.2rem; }
        .mb-2 { margin-bottom: 1.2rem; }
        .gap-1 { gap: 0.6rem; }
        .text-center { text-align: center; }
        .w-full { width: 100%; }

        /* username lab grid */
        .username-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
            margin-top: 1rem;
        }
        .username-card {
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 0.8rem;
            transition: 0.1s;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .username-card .uname { font-weight: 500; font-size: 1rem; }
        .username-card .meta { font-size: 0.7rem; color: var(--muted); }
        .username-card .actions {
            display: flex;
            gap: 6px;
            margin-top: 6px;
            flex-wrap: wrap;
        }
        .username-card .actions button {
            background: transparent;
            border: none;
            color: var(--muted);
            cursor: pointer;
            font-size: 0.8rem;
            padding: 0.1rem 0.4rem;
            border-radius: 6px;
        }
        .username-card .actions button:hover { background: var(--border); color: var(--text); }

        .platform-chip {
            background: var(--bg);
            border-radius: 20px;
            padding: 0.05rem 0.6rem;
            font-size: 0.65rem;
            border: 1px solid var(--border);
            display: inline-block;
        }

        /* scrollable tabs */
        .tab-bar {
            display: flex;
            gap: 4px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.3rem;
            flex-wrap: wrap;
        }
        .tab-bar button {
            background: none;
            border: none;
            color: var(--muted);
            padding: 0.4rem 1rem;
            font-weight: 500;
            border-radius: 30px;
            cursor: pointer;
        }
        .tab-bar button.active { background: var(--surface-2); color: var(--text); }

        /* AI chat */
        .chat-container {
            display: flex;
            flex-direction: column;
            height: 400px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--bg);
            overflow: hidden;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .chat-msg {
            max-width: 80%;
            padding: 0.7rem 1rem;
            border-radius: 16px;
            background: var(--surface-2);
            align-self: flex-start;
        }
        .chat-msg.user { align-self: flex-end; background: var(--primary); color: #fff; }
        .chat-input-wrap {
            display: flex;
            gap: 8px;
            padding: 0.8rem;
            background: var(--surface);
            border-top: 1px solid var(--border);
        }
        .chat-input-wrap input { flex: 1; }
        .chat-input-wrap button { background: var(--primary); border: none; color: #fff; padding: 0 1.2rem; border-radius: 30px; cursor: pointer; }

        /* onboarding wizard */
        .wizard-step { display: none; }
        .wizard-step.active { display: block; }
        .wizard-progress { display: flex; gap: 8px; margin-bottom: 1.5rem; }
        .wizard-progress .dot { width: 32px; height: 4px; background: var(--border); border-radius: 10px; }
        .wizard-progress .dot.active { background: var(--primary); }
    </style>
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">
    <div class="brand">
        <span class="brand-icon"><i class="fas fa-cube"></i></span>
        <span class="brand-text">Zenith</span>
    </div>
    <nav class="sidebar-nav" id="sidebarNav">
        <a href="#" data-view="dashboard" class="active"><i class="fas fa-th-large"></i><span class="sidebar-label">Dashboard</span></a>
        <a href="#" data-view="workspace"><i class="fas fa-layer-group"></i><span class="sidebar-label">Workspace</span></a>
        <a href="#" data-view="usernames"><i class="fas fa-tag"></i><span class="sidebar-label">Username Lab</span></a>
        <a href="#" data-view="discord"><i class="fab fa-discord"></i><span class="sidebar-label">Discord Manager</span></a>
        <a href="#" data-view="assistant"><i class="fas fa-robot"></i><span class="sidebar-label">AI Assistant</span></a>
        <a href="#" data-view="projects"><i class="fas fa-code"></i><span class="sidebar-label">Project Builder</span></a>
        <a href="#" data-view="profiles"><i class="fas fa-user-circle"></i><span class="sidebar-label">Profile Studio</span></a>
        <a href="#" data-view="proxies"><i class="fas fa-network-wired"></i><span class="sidebar-label">Proxy Lab</span></a>
        <a href="#" data-view="downloads"><i class="fas fa-download"></i><span class="sidebar-label">Downloads</span></a>
        <a href="#" data-view="settings"><i class="fas fa-cog"></i><span class="sidebar-label">Settings</span></a>
    </nav>
    <div class="sidebar-footer">
        <span class="badge">v1.0</span> · <span class="text-muted">demo</span>
    </div>
</aside>

<!-- MAIN -->
<div class="main">
    <!-- topbar -->
    <header class="topbar">
        <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
        <div class="search-wrap">
            <i class="fas fa-search"></i>
            <input type="text" placeholder="Ctrl+K search..." id="globalSearchInput">
        </div>
        <div class="actions">
            <span class="workspace-badge"><i class="fas fa-cubes"></i> <span id="workspaceLabel">default</span></span>
            <button id="themeToggle"><i class="fas fa-moon"></i></button>
            <button id="notifBell"><i class="fas fa-bell"></i><span class="badge" style="margin-left: -6px; font-size:0.6rem;">3</span></button>
            <button id="accountMenuBtn"><i class="fas fa-user-circle" style="font-size:1.6rem;"></i></button>
        </div>
    </header>

    <!-- page content -->
    <div class="page-content" id="pageContent">
        <!-- views rendered by JS -->
    </div>

    <!-- bottom nav (mobile) -->
    <nav class="bottom-nav" id="bottomNav">
        <a href="#" data-view="dashboard" class="active"><i class="fas fa-th-large"></i><span>Home</span></a>
        <a href="#" data-view="usernames"><i class="fas fa-tag"></i><span>Usernames</span></a>
        <a href="#" data-view="assistant"><i class="fas fa-robot"></i><span>AI</span></a>
        <a href="#" data-view="discord"><i class="fab fa-discord"></i><span>Discord</span></a>
        <a href="#" data-view="settings"><i class="fas fa-cog"></i><span>Settings</span></a>
    </nav>
</div>

<!-- MODAL container -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal-box" id="modalBox"></div>
</div>

<!-- TOAST container -->
<div class="toast-container" id="toastContainer"></div>

<script>
    // --------------------------------------------------------------
    //  DATA LAYER (localStorage)
    // --------------------------------------------------------------
    const APP_KEY = 'zenith_data';
    let data = loadData();

    function defaultData() {
        return {
            users: [],
            sessions: [],
            workspaces: [{ id: 'ws1', name: 'default', ownerId: null }],
            currentWorkspace: 'ws1',
            usernames: [],
            projects: [],
            conversations: [],
            discordConfigs: [],
            proxies: [],
            profiles: [],
            notifications: [],
            settings: { theme: 'dark', accent: '#6c8cff' }
        };
    }

    function loadData() {
        try {
            const raw = localStorage.getItem(APP_KEY);
            if (raw) return JSON.parse(raw);
        } catch (e) {}
        const d = defaultData();
        saveData(d);
        return d;
    }

    function saveData(d) {
        if (!d) d = data;
        localStorage.setItem(APP_KEY, JSON.stringify(d));
    }

    function generateId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

    // helpers
    function getWorkspace() {
        return data.workspaces.find(w => w.id === data.currentWorkspace) || data.workspaces[0];
    }

    function getCurrentUser() {
        const sid = sessionStorage.getItem('zenith_session');
        if (!sid) return null;
        return data.users.find(u => u.id === sid) || null;
    }

    // authentication mock
    function loginUser(email, password) {
        const user = data.users.find(u => u.email === email && u.password === password);
        if (user) {
            sessionStorage.setItem('zenith_session', user.id);
            return user;
        }
        return null;
    }

    function registerUser(username, displayName, email, password) {
        const exists = data.users.some(u => u.email === email || u.username === username);
        if (exists) return null;
        const isFirst = data.users.length === 0;
        const user = {
            id: generateId(),
            username,
            displayName,
            email,
            password,
            role: isFirst ? 'owner' : 'member',
            createdAt: new Date().toISOString()
        };
        data.users.push(user);
        if (isFirst) {
            const ws = data.workspaces[0];
            ws.ownerId = user.id;
        }
        saveData();
        return user;
    }

    // notification
    function addNotification(message, type = 'info') {
        data.notifications.unshift({ id: generateId(), message, type, timestamp: Date.now() });
        if (data.notifications.length > 50) data.notifications.pop();
        saveData();
        renderNotifications();
    }

    function showToast(message, type = 'info') {
        const container = document.getElementById('toastContainer');
        const t = document.createElement('div');
        t.className = `toast toast-${type}`;
        t.textContent = message;
        container.appendChild(t);
        setTimeout(() => { t.remove(); }, 3000);
    }

    // --------------------------------------------------------------
    //  ROUTER
    // --------------------------------------------------------------
    let currentView = 'dashboard';

    function navigate(view) {
        currentView = view;
        // update nav
        document.querySelectorAll('.sidebar-nav a, .bottom-nav a').forEach(el => {
            el.classList.toggle('active', el.dataset.view === view);
        });
        renderView(view);
        // close mobile sidebar
        document.getElementById('sidebar').classList.remove('open');
        // update URL hash
        window.location.hash = view;
    }

    function renderView(view) {
        const container = document.getElementById('pageContent');
        switch(view) {
            case 'dashboard': container.innerHTML = renderDashboard(); break;
            case 'workspace': container.innerHTML = renderWorkspace(); break;
            case 'usernames': container.innerHTML = renderUsernameLab(); break;
            case 'discord': container.innerHTML = renderDiscord(); break;
            case 'assistant': container.innerHTML = renderAssistant(); break;
            case 'projects': container.innerHTML = renderProjects(); break;
            case 'profiles': container.innerHTML = renderProfiles(); break;
            case 'proxies': container.innerHTML = renderProxies(); break;
            case 'downloads': container.innerHTML = renderDownloads(); break;
            case 'settings': container.innerHTML = renderSettings(); break;
            default: container.innerHTML = '<h2>Page not found</h2>';
        }
        // re-bind events
        bindViewEvents(view);
    }

    // --------------------------------------------------------------
    //  RENDER FUNCTIONS (each returns HTML string)
    // --------------------------------------------------------------
    function renderDashboard() {
        const user = getCurrentUser();
        const ws = getWorkspace();
        const roleBadge = user?.role === 'owner' ? '<span class="badge badge-owner">Owner</span>' : 
                          user?.role === 'admin' ? '<span class="badge">Admin</span>' : '<span class="badge">Member</span>';
        return `
            <div class="flex-between"><h2>Dashboard</h2><span>${roleBadge}</span></div>
            <div class="card-grid">
                <div class="stat-card"><div class="label">Projects</div><div class="num">${data.projects.length}</div></div>
                <div class="stat-card"><div class="label">Saved Usernames</div><div class="num">${data.usernames.length}</div></div>
                <div class="stat-card"><div class="label">Conversations</div><div class="num">${data.conversations.length}</div></div>
                <div class="stat-card"><div class="label">Workspaces</div><div class="num">${data.workspaces.length}</div></div>
            </div>
            <div class="card">
                <div class="card-title"><i class="fas fa-user"></i> Welcome, ${user?.displayName || 'Guest'}</div>
                <p class="text-muted">${user?.email || 'no email'} · workspace: ${ws.name}</p>
                <div class="flex mt-2">

    // --------------------------------------------------------------
    //  EVENT BINDING
    // --------------------------------------------------------------
    function bindViewEvents(view) {
        // quick actions
        document.querySelectorAll('[data-action]').forEach(el => {
            el.onclick = (e) => {
                const action = el.dataset.action;
                switch(action) {
                    case 'quick-username': navigate('usernames'); break;
                    case 'quick-assistant': navigate('assistant'); break;
                    case 'quick-project': document.getElementById('projectName')?.focus(); break;
                    case 'add-workspace': openModal('workspace'); break;
                    case 'switch-workspace': showToast('Switch workspace (demo)', 'info'); break;
                    case 'discord-connect': showToast('Discord bot connected (mock)', 'success'); break;
                    case 'discord-nuke-warning': 
                        if (getCurrentUser()?.role === 'owner') {
                            showToast('⚠️ Owner: server safety sweep triggered (mock)', 'warning');
                        } else { showToast('Only owner can perform this action.', 'error'); }
                        break;
                    case 'discord-timeout': showToast('Timeout user (mock)', 'info'); break;
                    case 'discord-kick': showToast('Kick user (mock)', 'info'); break;
                    case 'discord-ban': showToast('Ban user (mock)', 'warning'); break;
                    case 'discord-lock': showToast('Channel locked (mock)', 'info'); break;
                    case 'new-conversation': 
                        data.conversations.push({ id: generateId(), title: 'New chat', messages: [] });
                        saveData(); showToast('Conversation created', 'success'); navigate('assistant'); break;
                    case 'assistant-settings': showToast('Open API settings', 'info'); break;
                    case 'delete-conv':
                        data.conversations = data.conversations.filter(c => c.id !== el.dataset.id);
                        saveData(); showToast('Deleted', 'info'); navigate('assistant'); break;
                    case 'generate-project':
                        const name = document.getElementById('projectName')?.value || 'project-' + Date.now();
                        data.projects.push({ id: generateId(), name, type: document.getElementById('projectType')?.value || 'web' });
                        saveData(); showToast(`Project "${name}" generated`, 'success'); navigate('projects'); break;
                    case 'delete-project':
                        data.projects = data.projects.filter(p => p.id !== el.dataset.id);
                        saveData(); showToast('Project deleted', 'info'); navigate('projects');
                        break;
                    case 'save-profile': showToast('Profile saved (mock)', 'success'); break;
                    case 'export-profile': showToast('Profile exported (mock)', 'info'); break;
                    case 'add-proxy': 
                        data.proxies.push({ id: generateId(), name: 'proxy-'+(data.proxies.length+1), host: '127.0.0.1', port: 8080 });
                        saveData(); showToast('Proxy added', 'success'); navigate('proxies');
                        break;
                    case 'delete-proxy':
                        data.proxies = data.proxies.filter(p => p.id !== el.dataset.id);
                        saveData(); showToast('Proxy deleted', 'info'); navigate('proxies');
                        break;
                    case 'logout':
                        sessionStorage.removeItem('zenith_session');
                        showToast('Logged out', 'info');
                        window.location.reload();
                        break;
                    case 'clear-data':
                        if (confirm('Reset all demo data?')) {
                            localStorage.removeItem(APP_KEY);
                            window.location.reload();
                        }
                        break;
                    case 'save-ai-settings':
                        showToast('AI settings saved (mock)', 'success');
                        break;
                    default: showToast(`Action: ${action}`, 'info');
                }
            };
        });

        // username generation
        document.querySelector('[data-format]')?.addEventListener('click', function() {
            const format = this.dataset.format;
            const prefix = document.getElementById('usernamePrefix')?.value || '';
            const suffix = document.getElementById('usernameSuffix')?.value || '';
            const count = parseInt(document.getElementById('usernameCount')?.value || 8);
            const candidates = [];
            for (let i = 0; i < count; i++) {
                const rand = Math.random().toString(36).slice(2, 2+ (format.includes('L')?4: (format.includes('n')?4:5)) );
                candidates.push({ name: prefix + rand + suffix, length: rand.length+prefix.length+suffix.length, type: format, platform: 'generic' });
            }
            data.usernames = candidates;
            saveData();
            navigate('usernames');
            showToast(`Generated ${candidates.length} usernames`, 'success');
        });

        document.getElementById('generateUsernamesBtn')?.addEventListener('click', function() {
            const prefix = document.getElementById('usernamePrefix')?.value || '';
            const suffix = document.getElementById('usernameSuffix')?.value || '';
            const count = parseInt(document.getElementById('usernameCount')?.value || 8);
            const candidates = [];
            for (let i = 0; i < count; i++) {
                const rand = Math.random().toString(36).slice(2, 6);
                candidates.push({ name: prefix + rand + suffix, length: rand.length+prefix.length+suffix.length, type: 'mixed', platform: 'generic' });
            }
            data.usernames = candidates;
            saveData();
            navigate('usernames');
            showToast(`Generated ${candidates.length} usernames`, 'success');
        });

        // chat send
        document.getElementById('chatSendBtn')?.addEventListener('click', function() {
            const input = document.getElementById('chatInput');
            const msg = input.value.trim();
            if (!msg) return;
            const container = document.getElementById('chatMessages');
            const userDiv = document.createElement('div');
            userDiv.className = 'chat-msg user';
            userDiv.textContent = msg;
            container.appendChild(userDiv);
            input.value = '';
            // mock response
            setTimeout(() => {
                const botDiv = document.createElement('div');
                botDiv.className = 'chat-msg';
                botDiv.textContent = 'I\'m Zenith. Here\'s a mock response to: "'+msg+'"';
                container.appendChild(botDiv);
                container.scrollTop = container.scrollHeight;
            }, 400);
            container.scrollTop = container.scrollHeight;
        });

        // copy/save username actions (delegated)
        document.querySelector('#usernameGrid')?.addEventListener('click', function(e) {
            const target = e.target.closest('button');
            if (!target) return;
            const name = target.dataset.name;
            if (target.dataset.action === 'copy-username') {
                navigator.clipboard?.writeText(name).then(() => showToast('Copied!', 'success'));
            } else if (target.dataset.action === 'save-username') {
                showToast('Saved ' + name, 'success');
            }
        });
    }

                            <div class="form-group"><label>Display name</label><input type="text" id="signupDisplay" placeholder="Zenith User"></div>
                            <div class="form-group"><label>Email</label><input type="email" id="signupEmail" placeholder="you@example.com"></div>
                            <div class="form-group"><label>Password</label><input type="password" id="signupPassword" placeholder="••••••••"></div>
                            <button class="btn btn-primary w-full" id="signupBtn"><i class="fas fa-user-plus"></i> Create account</button>
                        </div>
                    </div>
                </div>
            </div>
        `;
        // tabs
        document.getElementById('loginTabBtn').onclick = () => {
            document.getElementById('loginForm').classList.remove('hidden');
            document.getElementById('signupForm').classList.add('hidden');
            document.getElementById('loginTabBtn').classList.add('btn-primary');
            document.getElementById('signupTabBtn').classList.remove('btn-primary');
        };
        document.getElementById('signupTabBtn').onclick = () => {
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('signupForm').classList.remove('hidden');
            document.getElementById('signupTabBtn').classList.add('btn-primary');
            document.getElementById('loginTabBtn').classList.remove('btn-primary');
        };
        // login
        document.getElementById('loginBtn').onclick = () => {
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPassword').value;
            const user = loginUser(email, pass);
            if (user) {
                showToast(`Welcome ${user.displayName}`, 'success');
                navigate('dashboard');
            } else {
                // try fallback
                if (email === 'owner@zenith' && pass === 'pass') {
                    const fallback = registerUser('owner', 'Owner', 'owner@zenith', 'pass');
                    if (fallback) { loginUser('owner@zenith', 'pass'); showToast('Owner created', 'success'); navigate('dashboard'); }
                } else {
                    showToast('Invalid credentials', 'error');
                }
            }
        };
        // signup
        document.getElementById('signupBtn').onclick = () => {
            const username = document.getElementById('signupUsername').value.trim();
            const display = document.getElementById('signupDisplay').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const pass = document.getElementById('signupPassword').value;
            if (!username || !email || !pass) { showToast('Fill all fields', 'error'); return; }
            const user = registerUser(username, display, email, pass);
            if (user) {
                loginUser(email, pass);
                showToast(`Account created! Welcome ${display}`, 'success');
                navigate('dashboard');
            } else {
                showToast('Username or email already taken', 'error');
            }
        };
    }

        } else {
            // load view from hash
            const hash = window.location.hash.slice(1) || 'dashboard';
            navigate(hash);
        }
        renderNotifications();
        // update workspace label
        const ws = getWorkspace();
        document.getElementById('workspaceLabel').textContent = ws?.name || 'default';
        // show onboarding if first user
        if (data.users.length === 1 && data.users[0].role === 'owner') {
            setTimeout(() => {
                showToast('Welcome! This is your first account (Owner).', 'info');
            }, 500);
        }
    }

    // handle hash changes
    window.addEventListener('hashchange', () => {
        const hash = window.location.hash.slice(1) || 'dashboard';
        if (getCurrentUser()) navigate(hash);
    });

    // start
    init();

    console.log('Zenith loaded · ' + data.users.length + ' users');
</script>
</body>
</html>
